    <!-- Suppress Netlify feedback badge / preview drawer -->
    <script>
      window.__NETLIFY_FEEDBACK_DISABLED__ = true;
      window.__NETLIFY_PREVIEW_DRAWER_DISABLED__ = true;
      try {
        const observer = new MutationObserver(function(mutations) {
          for (var i = 0; i < mutations.length; i++) {
            var added = mutations[i].addedNodes;
            for (var j = 0; j < added.length; j++) {
              var node = added[j];
              if (node.nodeType === 1) {
                var name = (node.tagName || '').toLowerCase();
                if (name.indexOf('netlify') !== -1 || (node.id && node.id.indexOf('netlify') !== -1)) {
                  node.remove();
                }
              }
            }
          }
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });
      } catch (e) {}
    </script>
