[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NETLIFY_PREVIEW_DRAWER = "false"
  NETLIFY_FEEDBACK = "false"
  ENABLE_NETLIFY_FEEDBACK = "false"
  NETLIFY_HUD = "false"

[[redirects]]
  from = "/.netlify/scripts/hud*"
  to = "/empty.js"
  status = 200
  force = true

[[redirects]]
  from = "/guide.html"
  to = "/guide.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
